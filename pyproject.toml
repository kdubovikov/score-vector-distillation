[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "score-vector-distillation"
version = "0.1.0"
description = "Reference implementation for score-only distillation of compact dense retrievers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [
  { name = "Kirill Dubovikov" },
  { name = "Martin Takáč" },
  { name = "Salem Lahlou" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=0.33,<1",
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "tabulate>=0.9,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
paper = [
  "matplotlib>=3.9,<4",
]
train = [
  "accelerate>=1.6,<2",
  "peft>=0.15,<1",
  "sentence-transformers>=4.1,<6",
  "torch==2.9.1",
  "transformers>=4.51,<5",
]
nv-teacher = [
  "datasets>=2.19,<3",
  "einops>=0.8,<1",
  "sentence-transformers==2.7.0",
  "tokenizers==0.19.1",
  "torch==2.9.1",
  "transformers==4.42.4",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
svd = "score_vector_distillation.cli:entrypoint"

[tool.uv]
conflicts = [
  [
    { extra = "train" },
    { extra = "nv-teacher" },
  ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/score_vector_distillation"]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/.gitattributes",
  "/.python-version",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/artifacts/paper",
  "/configs",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]
exclude = [
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv*",
  "/dist",
  "/tests/unit/test_core_eval_campaign.py",
  "/tests/unit/test_e006_*.py",
  "/tests/unit/test_evaluator_alignment.py",
  "/tests/unit/test_full_scoring_pipeline.py",
  "/tests/unit/test_paper_reevaluation.py",
  "/tests/unit/test_proxy_*.py",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv-*"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
  "accelerate.*",
  "huggingface_hub.*",
  "peft.*",
  "pyarrow.*",
  "sentence_transformers.*",
  "sklearn.*",
  "transformers.*",
]
ignore_missing_imports = true
