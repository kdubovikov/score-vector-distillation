provenance:
  citation:
    title: 'BEIR: A Heterogeneous Benchmark for Zero-shot Evaluation of Information
      Retrieval Models'
    url: https://github.com/beir-cellar/beir
  note: Immutable E006 copy of the public paper panel. The pinned ArguAna archive
    has five qrel document IDs absent from its corpus; they remain part of the evaluation
    denominator to match the frozen protocol.
  pin_verification: SHA-256 values were computed from the public archives on 2026-07-13
    and cross-checked against the MD5 values published by the BEIR maintainers.
  provider: BEIR public dataset snapshots
