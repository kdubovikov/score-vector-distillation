row_construction:
  candidates:
    count: 32
    positive_index: 0
    strategy: tfidf
    seed: 42
    tfidf_max_features: 200000
    tfidf_top_pool: 200
    query_batch_size: 256
    require_disjoint_query_ids: true
  train:
    - dataset: SciFact
      split: train
      expected_rows: 809
    - dataset: NFCorpus
      split: train
      expected_rows: 2590
    - dataset: FiQA
      split: train
      expected_rows: 5500
  eval:
    - dataset: SciFact
      split: test
      max_rows: 200
      expected_rows: 200
    - dataset: NFCorpus
      split: dev
      max_rows: 324
      expected_rows: 324
    - dataset: FiQA
      split: dev
      max_rows: 500
      expected_rows: 500

full_corpus_evaluation:
  - {dataset: SciFact, split: test}
  - {dataset: NFCorpus, split: test}
  - {dataset: FiQA, split: test}
  - {dataset: ArguAna, split: test}
  - {dataset: SciDocs, split: test}
  - {dataset: TREC-COVID, split: test}
  - {dataset: Webis-Touche2020, split: test}
  - {dataset: Quora, split: test}
