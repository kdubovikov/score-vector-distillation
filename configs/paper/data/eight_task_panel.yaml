schema_version: 1

provenance:
  provider: BEIR public dataset snapshots
  citation:
    title: "BEIR: A Heterogeneous Benchmark for Zero-shot Evaluation of Information Retrieval Models"
    url: https://github.com/beir-cellar/beir
  note: >-
    The archive snapshots are distributed by BEIR. Original dataset citations
    and licenses continue to apply. The reproduction code parses the normalized
    snapshot files directly and does not depend on the BEIR Python package.
    The pinned ArguAna archive has five qrel document IDs absent from its
    corpus; they are preserved in evaluation to match BEIR metrics.
  pin_verification: >-
    SHA-256 values were computed from the public archives on 2026-07-13 and
    cross-checked against the MD5 values published by the BEIR maintainers.
